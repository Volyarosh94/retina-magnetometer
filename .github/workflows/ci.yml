name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # The uv the image builds with (the Dockerfile's UV_VERSION). setup-uv
      # reads an empty version as "latest", so an unreadable one fails here
      # instead of quietly unpinning CI.
      - id: uv
        run: |
          version="$(sed -n 's/^ARG UV_VERSION=//p' Dockerfile)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Expected one UV_VERSION in the Dockerfile, found: '$version'"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: ${{ steps.uv.outputs.version }}
          enable-cache: false
      # --locked fails the job when uv.lock no longer matches pyproject.toml.
      - run: uv sync --locked
      - run: tools/check.sh

  # The image for both architectures the fleet and CI use, built but not
  # pushed: a dependency without an arm64 wheel fails here, not on a node.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The demo as a user runs it: the app and the simulator in two containers,
  # talking I2C over TCP. Green only if the app finds the simulated sensor,
  # samples it, and serves the samples back.
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: docker compose up -d --build
      - name: The app samples the simulated sensor
        run: |
          for _ in $(seq 60); do
            curl -fsS localhost:3030/api/health | jq -e '.state == "ok" and .samples_total >= 3' >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS localhost:3030/api/health | jq -e '.state == "ok" and .samples_total >= 3 and .sensor.revid == "0x22" and .self_test.passed'
          curl -fsS "localhost:3030/api/series?window=600" | jq -e '(.t | length) >= 3'
          curl -fsS localhost:3030/api/orientation | jq -e '.down_axis == "-Z" and (.heading_true_deg - 37 | fabs) < 2'
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
