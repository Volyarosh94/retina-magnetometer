version: 2
updates:
  # Every action is pinned to a commit, so a pin moves only when this moves it:
  # Dependabot raises the SHA and the version comment beside it together.
  # The cooldown keeps a release out of CI until it has been public for a week,
  # long enough for a compromised one to be noticed and pulled.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # A major version gets a PR of its own.
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]

  # The entries below take the same cooldown for the same reason.

  # pyproject.toml and uv.lock. Nothing relocks on its own (the org's ADR
  # 2026-09-23-python-apps-lock-with-uv), so this is how a fix in a
  # dependency, direct or not, reaches the image.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # Pinned again as the pre-commit hook's rev, and the two move together,
      # so the pre-commit entry proposes it.
      - dependency-name: ruff
    groups:
      uv:
        patterns: ["*"]
        update-types: [minor, patch]

  # .pre-commit-config.yaml's hook revisions.
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      pre-commit:
        patterns: ["*"]
        update-types: [minor, patch]
        # ruff comes in a PR of its own, which also has to move the dev
        # group's pin and relock, so it cannot hold the other hooks back.
        exclude-patterns: ["*ruff-pre-commit"]

  # No docker entry. The base image is the floating python:3.12-slim, which
  # takes Python's patch releases at every build, and uv moves by hand with
  # the lock, which has to be written by the uv the Dockerfile names.
